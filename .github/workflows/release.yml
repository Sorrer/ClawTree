name: Release

on:
  push:
    tags:
      - 'v*'          # Automatically build + release on version tags (e.g. v0.1.0)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Leave empty for nightly.'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC daily — nightly build

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: clawtree

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: x86_64-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            artifact: aarch64-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            artifact: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            artifact: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ARCHIVE="${BINARY_NAME}-${{ matrix.artifact }}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar czf "../../../${ARCHIVE}" "${BINARY_NAME}"
          cd ../../..
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.artifact }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for changelog context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push — use the pushed tag directly
            TAG="${GITHUB_REF_NAME}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=Release ${TAG}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            # Manual dispatch with a tag specified
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=Release ${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Schedule or manual dispatch without tag — nightly
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=Nightly Build ($(date -u +%Y-%m-%d))" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Delete existing nightly release
        if: steps.tag.outputs.tag == 'nightly'
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create or update release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ steps.tag.outputs.title }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # If the release already exists (e.g. created via GitHub UI), upload assets to it
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading artifacts..."
            gh release upload "$TAG" \
              artifacts/*.tar.gz artifacts/*.sha256 \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              artifacts/*.tar.gz artifacts/*.sha256 \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
