[package]
name = "worktree-claude-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
portable-pty = "0.8"
vt100 = "0.16"
tui-term = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
ansi-to-tui = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
