<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Consolas, monospace; }
    </style>
    <clipPath id="sidebar-clip">
      <rect x="10" y="40" width="100" height="130"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="720" height="230" rx="12" fill="#1a1b26"/>

  <!-- LEFT: No terminal tabs -->
  <g transform="translate(30, 20)">
    <!-- Title -->
    <text x="140" y="24" text-anchor="middle" fill="#f7768e" font-size="15" font-weight="700" letter-spacing="0.5">NO TERMINAL TABS</text>

    <!-- Tab bar mockup -->
    <rect x="10" y="40" width="260" height="130" rx="6" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <!-- Tab row background -->
    <rect x="10" y="40" width="260" height="28" rx="6" fill="#1f2335"/>
    <rect x="10" y="54" width="260" height="14" fill="#1f2335"/>
    <!-- Individual tabs -->
    <rect x="16" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="44" y="58" text-anchor="middle" fill="#787c99" font-size="9">main</text>
    <rect x="76" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="104" y="58" text-anchor="middle" fill="#787c99" font-size="9">feat-1</text>
    <rect x="136" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="164" y="58" text-anchor="middle" fill="#787c99" font-size="9">feat-2</text>
    <rect x="196" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="224" y="58" text-anchor="middle" fill="#787c99" font-size="9">fix-3</text>
    <!-- Terminal content lines -->
    <rect x="20" y="78" width="120" height="6" rx="2" fill="#3b4261" opacity="0.5"/>
    <rect x="20" y="90" width="180" height="6" rx="2" fill="#3b4261" opacity="0.4"/>
    <rect x="20" y="102" width="90" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="20" y="114" width="150" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="20" y="126" width="60" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <rect x="20" y="138" width="110" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <!-- Red X overlay -->
    <line x1="40" y1="60" x2="250" y2="150" stroke="#f7768e" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <line x1="250" y1="60" x2="40" y2="150" stroke="#f7768e" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Divider -->
  <line x1="360" y1="30" x2="360" y2="180" stroke="#3b4261" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT: Yes worktree sidebar -->
  <g transform="translate(390, 20)">
    <!-- Title -->
    <text x="150" y="24" text-anchor="middle" fill="#9ece6a" font-size="15" font-weight="700" letter-spacing="0.5">YES WORKTREE SIDEBAR</text>

    <!-- App mockup with cyan border like the real app -->
    <rect x="10" y="40" width="280" height="130" rx="6" fill="#24283b" stroke="#3b4261" stroke-width="1"/>

    <!-- Sidebar with cyan/teal left border like the real app -->
    <rect x="10" y="40" width="100" height="130" rx="6" fill="#1a1b26"/>
    <rect x="10" y="40" width="3" height="130" rx="1" fill="#2ac3de"/>

    <!-- Sidebar content clipped to sidebar bounds -->
    <g clip-path="url(#sidebar-clip)">
      <!-- Sidebar header -->
      <text x="22" y="58" fill="#7dcfff" font-size="10" font-weight="600">Worktrees</text>

      <!-- Tree items matching real sidebar -->
      <!-- feature/auth - expanded, selected (highlight bar) -->
      <rect x="13" y="62" width="94" height="14" rx="2" fill="#283457"/>
      <text x="20" y="73" fill="#c0caf5" font-size="9" font-weight="600">&#9660; feature/auth*</text>
      <!-- Claude Code child sessions -->
      <text x="24" y="87" fill="#9ece6a" font-size="8">&#9679; Fixing Bug 1</text>
      <text x="24" y="99" fill="#9ece6a" font-size="8">&#9679; Refactoring Code</text>

      <!-- fix/logging - collapsed -->
      <text x="20" y="115" fill="#a9b1d6" font-size="9">&#9654; fix/logging*</text>

      <!-- main - collapsed, inactive -->
      <text x="20" y="131" fill="#565f89" font-size="9">&#9654; main</text>
    </g>

    <!-- Divider line between sidebar and terminal -->
    <line x1="113" y1="40" x2="113" y2="170" stroke="#2ac3de" stroke-width="1" opacity="0.5"/>

    <!-- Terminal area content -->
    <rect x="120" y="48" width="160" height="6" rx="2" fill="#3b4261" opacity="0.5"/>
    <rect x="120" y="60" width="120" height="6" rx="2" fill="#3b4261" opacity="0.4"/>
    <rect x="120" y="72" width="150" height="6" rx="2" fill="#9ece6a" opacity="0.3"/>
    <rect x="120" y="84" width="80" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="120" y="96" width="140" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="120" y="108" width="60" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <rect x="120" y="120" width="110" height="6" rx="2" fill="#7aa2f7" opacity="0.3"/>
    <rect x="120" y="132" width="90" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <rect x="120" y="144" width="130" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <text x="195" y="162" text-anchor="middle" fill="#9ece6a" font-size="9" font-style="italic">all sessions visible</text>

    <!-- Green checkmark -->
    <circle cx="278" cy="50" r="12" fill="#9ece6a" opacity="0.15"/>
    <polyline points="271,50 276,55 285,44" fill="none" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom tagline with more padding -->
  <text x="360" y="218" text-anchor="middle" fill="#565f89" font-size="11" font-style="italic">Stop juggling tabs and losing context. Manage everything in one place.</text>
</svg>
