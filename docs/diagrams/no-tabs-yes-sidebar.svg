<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200">
  <defs>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="12" fill="#1a1b26"/>

  <!-- LEFT: No terminal tabs -->
  <g transform="translate(30, 20)">
    <!-- Title -->
    <text x="140" y="24" text-anchor="middle" fill="#f7768e" font-size="15" font-weight="700" letter-spacing="0.5">NO TERMINAL TABS</text>

    <!-- Tab bar mockup -->
    <rect x="10" y="40" width="260" height="120" rx="6" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <!-- Tabs -->
    <rect x="10" y="40" width="260" height="28" rx="6" fill="#1f2335"/>
    <rect x="10" y="54" width="260" height="14" fill="#1f2335"/>
    <rect x="16" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="44" y="58" text-anchor="middle" fill="#787c99" font-size="9">main</text>
    <rect x="76" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="104" y="58" text-anchor="middle" fill="#787c99" font-size="9">feat-1</text>
    <rect x="136" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="164" y="58" text-anchor="middle" fill="#787c99" font-size="9">feat-2</text>
    <rect x="196" y="44" width="56" height="20" rx="4" fill="#3b4261"/>
    <text x="224" y="58" text-anchor="middle" fill="#787c99" font-size="9">fix-3</text>
    <!-- Terminal content lines -->
    <rect x="20" y="76" width="120" height="6" rx="2" fill="#3b4261" opacity="0.5"/>
    <rect x="20" y="88" width="180" height="6" rx="2" fill="#3b4261" opacity="0.4"/>
    <rect x="20" y="100" width="90" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="20" y="112" width="150" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="20" y="124" width="60" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <text x="200" y="120" fill="#565f89" font-size="10" font-style="italic">lost context...</text>

    <!-- Red X overlay -->
    <line x1="40" y1="60" x2="250" y2="140" stroke="#f7768e" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <line x1="250" y1="60" x2="40" y2="140" stroke="#f7768e" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Divider -->
  <line x1="360" y1="30" x2="360" y2="170" stroke="#3b4261" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT: Yes worktree sidebar -->
  <g transform="translate(390, 20)">
    <!-- Title -->
    <text x="150" y="24" text-anchor="middle" fill="#9ece6a" font-size="15" font-weight="700" letter-spacing="0.5">YES WORKTREE SIDEBAR</text>

    <!-- App mockup -->
    <rect x="10" y="40" width="280" height="120" rx="6" fill="#24283b" stroke="#3b4261" stroke-width="1"/>

    <!-- Sidebar -->
    <rect x="10" y="40" width="90" height="120" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1"/>
    <rect x="100" y="40" width="1" height="120" fill="#1f2335"/>

    <!-- Sidebar header -->
    <text x="20" y="56" fill="#7aa2f7" font-size="9" font-weight="600">Worktrees</text>

    <!-- Tree items -->
    <text x="20" y="72" fill="#c0caf5" font-size="9">&#9662; feature/auth</text>
    <text x="28" y="84" fill="#9ece6a" font-size="8">&#9679; Claude Code</text>
    <text x="20" y="98" fill="#c0caf5" font-size="9">&#9662; fix/login</text>
    <text x="28" y="110" fill="#9ece6a" font-size="8">&#9679; Claude Code</text>
    <text x="20" y="124" fill="#787c99" font-size="9">&#9656; main</text>

    <!-- Status dots -->
    <circle cx="86" cy="69" r="3" fill="#9ece6a"/>
    <circle cx="86" cy="95" r="3" fill="#e0af68"/>
    <circle cx="86" cy="121" r="3" fill="#565f89"/>

    <!-- Terminal area -->
    <rect x="105" y="44" width="180" height="6" rx="2" fill="#3b4261" opacity="0.5"/>
    <rect x="105" y="56" width="140" height="6" rx="2" fill="#3b4261" opacity="0.4"/>
    <rect x="105" y="68" width="170" height="6" rx="2" fill="#9ece6a" opacity="0.3"/>
    <rect x="105" y="80" width="100" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="105" y="92" width="160" height="6" rx="2" fill="#3b4261" opacity="0.3"/>
    <rect x="105" y="104" width="80" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <rect x="105" y="116" width="130" height="6" rx="2" fill="#7aa2f7" opacity="0.3"/>
    <rect x="105" y="128" width="50" height="6" rx="2" fill="#3b4261" opacity="0.2"/>
    <text x="170" y="148" text-anchor="middle" fill="#9ece6a" font-size="9" font-style="italic">all sessions visible</text>

    <!-- Green checkmark -->
    <circle cx="280" cy="50" r="12" fill="#9ece6a" opacity="0.15"/>
    <polyline points="273,50 278,55 287,44" fill="none" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom tagline -->
  <text x="360" y="190" text-anchor="middle" fill="#565f89" font-size="11" font-style="italic">Stop juggling tabs. See everything in one place.</text>
</svg>
